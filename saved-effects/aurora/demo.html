<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora cursor effect demo</title>
<link rel="stylesheet" href="aurora.css" />
<style>
  html, body { margin: 0; background: #07070d; color: #f4f4f5; font-family: system-ui, sans-serif; }
  #intro { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 6rem 1.5rem; }
  h1 { font-size: clamp(2.4rem, 8vw, 5rem); margin: 0 0 1rem; letter-spacing: -0.02em; }
  p { color: #a0a0a8; max-width: 32rem; margin: 0 auto; }
  .below { min-height: 60vh; display: grid; place-items: center; color: #8a8a92; border-top: 1px solid #2a2a30; }
</style>
</head>
<body>
  <canvas id="aurora-canvas"></canvas>

  <section id="intro">
    <div>
      <h1>Move your cursor here</h1>
      <p>Sweep left to right, then stop: the aurora fades away in the direction you were travelling. Move right to left and it goes the other way.</p>
    </div>
  </section>
  <section class="below">No aurora below the intro section.</section>

  <script src="aurora.js"></script>
</body>
</html>
